name: Kombu

on:
  push:
    branches: ['main']
    paths:
      - '**.py'
      - '**.txt'
      - '**.toml'
      - 'tox.ini'
      - '.github/workflows/python-package.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**.py'
      - '**.txt'
      - '**.toml'
      - 'tox.ini'
      - '.github/workflows/python-package.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'requirements/**/*.txt'

      - name: Install tox and plugins
        run: uv tool install tox --with tox-uv --with tox-gh --with tox-docker

      - name: Run linters, typecheck, and docs checks
        timeout-minutes: 30
        run: tox -v -e flake8,apicheck,pydocstyle,mypy,linkcheck

  Unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        os: ['blacksmith-4vcpu-ubuntu-2404']
        experimental: [false]
        include:
          - python-version: 'pypy-3.11'
            os: 'blacksmith-4vcpu-ubuntu-2404'
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    env:
      TOX_PYTHON: ${{ matrix.python-version == 'pypy-3.11' && 'pypy3.11' || matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: startsWith(matrix.os, 'blacksmith-4vcpu-ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Set up uv & Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: 'requirements/**/*.txt'

      - name: Install tox and plugins
        run: uv tool install tox --with tox-uv --with tox-gh --with tox-docker

      - name: Run ${{ env.TOX_PYTHON }}-unit
        timeout-minutes: 60
        run: tox -vv -e "${TOX_PYTHON}-unit"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && !matrix.experimental }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codecov
        if: ${{ !matrix.experimental }}
        uses: codecov/codecov-action@v7
        with:
          report_type: coverage
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  Integration:
    needs: [Unit]
    if: needs.Unit.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        toxenv: ['py-amqp', 'redis', 'mongodb', 'kafka', 'sqs', 'pgmq']
        experimental: [false]
        include:
          - python-version: 'pypy-3.11'
            toxenv: 'py-amqp'
            experimental: true
          - python-version: 'pypy-3.11'
            toxenv: 'redis'
            experimental: true
          - python-version: 'pypy-3.11'
            toxenv: 'mongodb'
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    env:
      TOX_PYTHON: ${{ matrix.python-version == 'pypy-3.11' && 'pypy3.11' || matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Set up uv & Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: 'requirements/**/*.txt'

      - name: Install tox and plugins
        run: uv tool install tox --with tox-uv --with tox-gh --with tox-docker

      - name: Run ${{ env.TOX_PYTHON }}-linux-integration-${{ matrix.toxenv }}
        timeout-minutes: 60
        run: tox -vv -e "${TOX_PYTHON}-linux-integration-${{ matrix.toxenv }}"